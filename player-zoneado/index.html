<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrine Digital — Zoneado V5</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b18;font-family:Arial;color:#fff}.stage{height:100vh;padding:6px;display:grid;gap:6px;background:#061525}.main{position:relative;min-width:0;min-height:0;background:#000}.main iframe{width:100%;height:100%;border:0}.side{display:grid;grid-template-rows:1fr 1fr;gap:6px}.card{background:#0b2340;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}.card img,.card video{width:100%;height:100%;object-fit:contain;background:#07182b}.copy{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,#000c)}.title{font-weight:800;font-size:clamp(16px,2vw,34px)}.text{font-size:clamp(11px,1.2vw,20px)}.footer{grid-column:1/3;background:#0872d8;display:grid;align-items:center;text-align:center;font-weight:700;font-size:clamp(11px,1.4vw,22px)}.footer div+div{border-left:1px solid #ffffff55}
@media(orientation:portrait) and (max-width:700px){html,body{overflow:auto}.stage{height:auto;min-height:100vh;grid-template-columns:1fr!important;grid-template-rows:58vh auto auto!important}.main,.side,.footer{grid-column:1!important}.side{grid-template-columns:1fr 1fr;grid-template-rows:none}.card{min-height:230px}.footer{min-height:70px;font-size:10px}}
</style></head><body><div class="stage" id="stage"><main class="main"><iframe id="p" allow="autoplay; fullscreen"></iframe></main><aside class="side"><section class="card" id="z1"><div class="copy"><div class="title" id="t1"></div><div class="text" id="x1"></div></div></section><section class="card" id="z2"><div class="copy"><div class="title" id="t2"></div><div class="text" id="x2"></div></div></section></aside><footer class="footer" id="foot"></footer></div>
<script>
const D={zone1Title:"VITRINE DIGITAL",zone1Text:"Sua marca em destaque",zone1Media:"",zone1Type:"",zone2Title:"FALE CONOSCO",zone2Text:"",zone2Media:"",zone2Type:"",mainPct:72,footerPct:22,footer:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]};
const q=new URLSearchParams(location.search),code=q.get("code")||"TV-85CCD986";p.src="../player/index.html?code="+encodeURIComponent(code);
let c=D;try{c={...D,...JSON.parse(localStorage.getItem("vitrine_zone_v5")||"{}")}}catch(e){}
stage.style.gridTemplateColumns=c.mainPct+"fr "+(100-c.mainPct)+"fr";stage.style.gridTemplateRows=(100-c.footerPct)+"fr "+c.footerPct+"fr";
function zone(n){let box=document.getElementById("z"+n),src=c["zone"+n+"Media"],typ=c["zone"+n+"Type"];if(src){let m=document.createElement(typ==="video"?"video":"img");m.src=src;if(typ==="video"){m.autoplay=true;m.loop=true;m.muted=true;m.playsInline=true}box.prepend(m)}document.getElementById("t"+n).textContent=c["zone"+n+"Title"]||"";document.getElementById("x"+n).textContent=c["zone"+n+"Text"]||""}
zone(1);zone(2);let f=(c.footer||D.footer).slice(0,4);foot.style.gridTemplateColumns=`repeat(${Math.max(1,f.length)},1fr)`;foot.innerHTML=f.map(v=>"<div>"+String(v).replace(/[<>]/g,"")+"</div>").join("");
</script></body></html>
