<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrine Digital — Zoneado V6</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial;color:#fff}.stage{height:100vh;padding:6px;display:grid;gap:6px;background:#061525}.main{min-width:0;min-height:0;background:#000}.main iframe{width:100%;height:100%;border:0}.side{display:grid;grid-template-rows:1fr 1fr;gap:6px}.card{background:#0b2340;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}.card img,.card video{width:100%;height:100%;object-fit:contain;background:#07182b}.copy{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,#000d)}.title{font-weight:800;font-size:clamp(16px,2vw,34px)}.text{font-size:clamp(11px,1.2vw,20px)}.footer{grid-column:1/3;background:#0872d8;display:grid;align-items:center;text-align:center;font-weight:700;font-size:clamp(11px,1.4vw,22px)}.footer div+div{border-left:1px solid #ffffff55}.hidden{display:none!important}@media(orientation:portrait) and (max-width:700px){html,body{overflow:auto}.stage{height:auto;min-height:100vh;grid-template-columns:1fr!important;grid-template-rows:58vh auto auto!important}.main,.side,.footer{grid-column:1!important}.side{grid-template-columns:1fr 1fr;grid-template-rows:none}.card{min-height:230px}.footer{min-height:70px;font-size:10px}}</style></head>
<body><div class="stage" id="stage"><main class="main"><iframe id="p" allow="autoplay; fullscreen"></iframe></main><aside class="side" id="side"><section class="card" id="z1"><div class="copy"><div class="title" id="t1"></div><div class="text" id="x1"></div></div></section><section class="card" id="z2"><div class="copy"><div class="title" id="t2"></div><div class="text" id="x2"></div></div></section></aside><footer class="footer" id="foot"></footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script>
<script>
(async()=>{
const q=new URLSearchParams(location.search),code=q.get("code")||"TV-85CCD986";p.src="../player/index.html?code="+encodeURIComponent(code);
const cfg=window.SUPABASE_CONFIG,db=supabase.createClient(cfg.url,cfg.key);
const {data:s}=await db.from("screens").select("id").eq("code",code).eq("active",true).maybeSingle();if(!s)return;
const {data:c}=await db.from("zone_layouts").select("*").eq("screen_id",s.id).eq("active",true).maybeSingle();if(!c)return;
stage.style.gridTemplateColumns=(c.main_pct||72)+"fr "+(100-(c.main_pct||72))+"fr";stage.style.gridTemplateRows=(100-(c.footer_pct||22))+"fr "+(c.footer_pct||22)+"fr";
if(c.layout==="fullscreen"){side.classList.add("hidden");foot.classList.add("hidden");stage.style.gridTemplateColumns="1fr";stage.style.gridTemplateRows="1fr"}
if(c.layout==="main_side"){foot.classList.add("hidden");stage.style.gridTemplateRows="1fr"}
const ids=[c.zone1_media_id,c.zone2_media_id].filter(Boolean);let mm={};if(ids.length){const {data}=await db.from("media").select("id,file_url,url,type,mime_type").in("id",ids).eq("active",true);(data||[]).forEach(m=>mm[m.id]=m)}
const DBN="vitrine_zone_media_v1",STORE="files";function odb(){return new Promise((ok,no)=>{let r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function local(url){if(!url)return"";try{let d=await odb(),b=await new Promise((ok,no)=>{let t=d.transaction(STORE),r=t.objectStore(STORE).get(url);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(b)return URL.createObjectURL(b);let res=await fetch(url,{cache:"force-cache"});if(!res.ok)return"";b=await res.blob();await new Promise((ok,no)=>{let t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(b,url);t.oncomplete=ok;t.onerror=()=>no(t.error)});return URL.createObjectURL(b)}catch(e){return""}}
async function zone(n,id){let box=document.getElementById("z"+n),m=mm[id];document.getElementById("t"+n).textContent=c["zone"+n+"_title"]||"";document.getElementById("x"+n).textContent=c["zone"+n+"_text"]||"";if(!m)return;let u=await local(m.file_url||m.url);if(!u)return;let vid=(m.type||m.mime_type||"").toLowerCase().includes("video");let el=document.createElement(vid?"video":"img");el.src=u;if(vid){el.autoplay=true;el.loop=true;el.muted=true;el.playsInline=true}box.prepend(el)}
await Promise.all([zone(1,c.zone1_media_id),zone(2,c.zone2_media_id)]);
let f=Array.isArray(c.footer_items)?c.footer_items:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"];foot.style.gridTemplateColumns=`repeat(${Math.max(1,f.length)},1fr)`;foot.innerHTML=f.map(v=>"<div>"+String(v).replace(/[<>]/g,"")+"</div>").join("");
})();
</script></body></html>
