<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Zoneado V7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.s{height:100vh;padding:5px;display:grid;gap:5px;background:#061525}.m{min-width:0;min-height:0}.side{display:grid;grid-template-rows:1fr 1fr;gap:5px}.z{background:#07182b;overflow:hidden;display:flex;align-items:center;justify-content:center}.z img,.z video{width:100%;height:100%;object-fit:contain}.f{grid-column:1/3;background:#0872d8;color:#fff;display:grid;align-items:center;text-align:center;font:700 clamp(11px,1.4vw,22px) Arial}.f div+div{border-left:1px solid #ffffff55}.hide{display:none!important}@media(orientation:portrait) and (max-width:700px){html,body{overflow:auto}.s{height:auto;min-height:100vh;grid-template-columns:1fr!important;grid-template-rows:58vh auto auto!important}.m,.side,.f{grid-column:1!important}.side{grid-template-columns:1fr 1fr;grid-template-rows:none}.z{min-height:230px}.f{min-height:70px}}</style></head><body><div class="s" id="s"><main class="m z" id="z0"></main><aside class="side" id="side"><div class="z" id="z1"></div><div class="z" id="z2"></div></aside><footer class="f" id="f"></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>
(async()=>{const q=new URLSearchParams(location.search),code=q.get("code")||"TV-ZONE-TESTE";const db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key),{data:sc}=await db.from("screens").select("id").eq("code",code).eq("active",true).maybeSingle();if(!sc)return;const {data:c}=await db.from("zone_layouts").select("*").eq("screen_id",sc.id).eq("active",true).maybeSingle();if(!c)return;s.style.gridTemplateColumns=(c.main_pct||72)+"fr "+(100-(c.main_pct||72))+"fr";s.style.gridTemplateRows=(100-(c.footer_pct||22))+"fr "+(c.footer_pct||22)+"fr";if(c.layout==="fullscreen"){side.classList.add("hide");f.classList.add("hide");s.style.gridTemplateColumns="1fr";s.style.gridTemplateRows="1fr"}else if(c.layout==="main_side"){f.classList.add("hide");s.style.gridTemplateRows="1fr"}let {data:items}=await db.from("zone_media_items").select("*").eq("zone_layout_id",c.id).eq("active",true).order("sort_order");const DB="vitrine_zone_v9";function odb(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function cached(u){try{let d=await odb(),b=await new Promise((ok,no)=>{let r=d.transaction("files").objectStore("files").get(u);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(!b){let res=await fetch(u,{cache:"force-cache"});if(!res.ok)return"";b=await res.blob();await new Promise((ok,no)=>{let t=d.transaction("files","readwrite");t.objectStore("files").put(b,u);t.oncomplete=ok;t.onerror=()=>no(t.error)})}return URL.createObjectURL(b)}catch(e){return""}}async function run(z){let a=(items||[]).filter(x=>x.zone_no===z);if(!a.length)return;let box=document.getElementById("z"+z),i=0;async function next(){let x=a[i++%a.length],u=await cached(x.file_url);if(!u)return setTimeout(next,3000);box.innerHTML="";let v=(x.mime_type||"").startsWith("video/"),el=document.createElement(v?"video":"img");el.src=u;box.appendChild(el);if(v){el.muted=true;el.playsInline=true;el.autoplay=true;el.onended=next;el.onerror=()=>setTimeout(next,1000);el.play().catch(()=>setTimeout(next,15000))}else setTimeout(next,(x.duration_seconds||15)*1000)}next()}run(0);run(1);run(2);let a=Array.isArray(c.footer_items)?c.footer_items:[];f.style.gridTemplateColumns=`repeat(${Math.max(1,a.length)},1fr)`;f.innerHTML=a.map(x=>"<div>"+String(x).replace(/[<>]/g,"")+"</div>").join("")})();
</script></body></html>
