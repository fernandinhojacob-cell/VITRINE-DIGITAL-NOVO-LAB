<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrine Digital — Zoneado V3</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b18;font-family:Arial;color:white}.stage{height:100vh;padding:6px;display:grid;gap:6px;grid-template-columns:72fr 28fr;grid-template-rows:78fr 22fr;background:#061525}.main{position:relative;min-width:0;min-height:0;background:#000}.main iframe{width:100%;height:100%;border:0}.side{display:grid;grid-template-rows:1fr 1fr;gap:6px}.card{background:linear-gradient(145deg,#0b2340,#0a1830);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;overflow:hidden}.card img{max-width:90%;max-height:55%;object-fit:contain;margin-bottom:12px}.title{font-weight:800;font-size:clamp(18px,2.5vw,42px)}.text{font-size:clamp(12px,1.4vw,24px);opacity:.9;margin-top:8px}.footer{grid-column:1/3;background:#0872d8;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-weight:700;font-size:clamp(12px,1.5vw,24px)}.footer div+div{border-left:1px solid #ffffff55}@media(orientation:portrait) and (max-width:700px){html,body{overflow:auto}.stage{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:58vh auto auto}.main{grid-column:1}.side{grid-column:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:none}.card{min-height:180px}.footer{grid-column:1;min-height:70px;font-size:11px}}</style></head>
<body><div class="stage"><main class="main"><iframe id="p" allow="autoplay; fullscreen"></iframe></main><aside class="side"><section class="card"><img id="img1" hidden><div class="title" id="t1"></div><div class="text" id="x1"></div></section><section class="card"><img id="img2" hidden><div class="title" id="t2"></div><div class="text" id="x2"></div></section></aside><footer class="footer" id="foot"></footer></div>
<script>
const DEF={zone1Title:"VITRINE DIGITAL",zone1Text:"Sua marca em destaque",zone1Image:"",zone2Title:"FALE CONOSCO",zone2Text:"QR Code / WhatsApp / chamada",zone2Image:"",footer:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]};
const q=new URLSearchParams(location.search),code=q.get("code")||"TV-85CCD986";
document.getElementById("p").src="../player/index.html?code="+encodeURIComponent(code);
let cfg=DEF;try{cfg={...DEF,...JSON.parse(localStorage.getItem("vitrine_zone_cfg")||"{}")}}catch(e){}
function put(i,title,text,img){document.getElementById("t"+i).textContent=title||"";document.getElementById("x"+i).textContent=text||"";const el=document.getElementById("img"+i);if(img){el.src=img;el.hidden=false}else el.hidden=true}
put(1,cfg.zone1Title,cfg.zone1Text,cfg.zone1Image);put(2,cfg.zone2Title,cfg.zone2Text,cfg.zone2Image);
document.getElementById("foot").innerHTML=(cfg.footer||DEF.footer).slice(0,4).map(x=>"<div>"+String(x).replace(/[<>]/g,"")+"</div>").join("");
</script></body></html>
