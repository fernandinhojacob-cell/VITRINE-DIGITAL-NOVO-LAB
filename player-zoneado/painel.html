<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoneamento V7</title><style>body{font-family:Arial;background:#061525;color:#fff;max-width:820px;margin:20px auto;padding:18px}.box{background:#0b2340;padding:18px;border-radius:14px;margin:14px 0}label{display:block;margin:12px 0 5px}select,input{width:100%;padding:12px;border:0;border-radius:8px}.pick{background:#102f53;color:#fff;border:1px dashed #5ba7ff}.btn{padding:12px 18px;border:0;border-radius:9px;background:#0872d8;color:#fff;font-weight:700;margin:8px 8px 0 0}.item{padding:10px;background:#102f53;border-radius:8px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.del{background:#8d2631;color:#fff;border:0;border-radius:7px}.muted{opacity:.75;font-size:13px}</style></head><body><h1>Zoneamento V7</h1><p>Arquivos exclusivos das zonas. Não precisam estar na Biblioteca nem na playlist principal.</p><div class="box"><label>Tela</label><select id="scr"></select><label>Layout</label><select id="lay"><option value="main_side_footer">Principal + lateral + faixa</option><option value="main_side">Principal + lateral</option><option value="fullscreen">Tela inteira</option></select><label>Principal (%)</label><input id="mp" type="range" min="55" max="90" value="72"><label>Faixa inferior (%)</label><input id="fp" type="range" min="10" max="35" value="22"><label>Faixa — textos separados por vírgula</label><input id="foot" value="EVENTOS, EMPRESAS, PROMOÇÕES, INFORMAÇÕES"><button class="btn" id="save">Salvar layout</button></div><div class="box"><h2>Zona lateral 1</h2><input class="pick" id="up1" type="file" accept="image/*,video/*" multiple><button class="btn" onclick="upload(1)">Enviar arquivos</button><div id="list1"></div></div><div class="box"><h2>Zona lateral 2</h2><input class="pick" id="up2" type="file" accept="image/*,video/*" multiple><button class="btn" onclick="upload(2)">Enviar arquivos</button><div id="list2"></div></div><a class="btn" id="open" target="_blank">Abrir Player Zoneado</a><p class="muted">Fotos permanecem 15 s; vídeos reproduzem até o fim. Os arquivos enviados ficam separados por tela/zona.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>
let db,layoutId,companyId;const $=x=>document.getElementById(x);
(async()=>{db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key);let {data:{session}}=await db.auth.getSession();if(!session){location.href="../admin/login.html";return}let {data:ss,error}=await db.from("screens").select("id,name,code,company_id").eq("active",true).order("name");if(error)return alert(error.message);$("scr").innerHTML=(ss||[]).map(s=>`<option value="${s.id}" data-code="${s.code}" data-company="${s.company_id}">${s.name} — ${s.code}</option>`).join("");$("scr").onchange=load;await load()})();
async function load(){let o=$("scr").selectedOptions[0];if(!o)return;companyId=o.dataset.company;$("open").href="index.html?code="+encodeURIComponent(o.dataset.code)+"&v=7";let {data:c}=await db.from("zone_layouts").select("*").eq("screen_id",$("scr").value).maybeSingle();if(!c){let {data:n,error}=await db.from("zone_layouts").insert({screen_id:$("scr").value,company_id:companyId}).select().single();if(error)return alert(error.message);c=n}layoutId=c.id;$("lay").value=c.layout;$("mp").value=c.main_pct;$("fp").value=c.footer_pct;$("foot").value=(c.footer_items||[]).join(", ");await lists()}
$("save").onclick=async()=>{let {error}=await db.from("zone_layouts").update({layout:$("lay").value,main_pct:+$("mp").value,footer_pct:+$("fp").value,footer_items:$("foot").value.split(",").map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()}).eq("id",layoutId);alert(error?error.message:"Layout salvo.")};
async function upload(z){let inp=$("up"+z),files=[...inp.files];if(!files.length)return alert("Selecione uma ou mais fotos/vídeos.");let base=Date.now();for(let i=0;i<files.length;i++){let f=files[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=`zones/${companyId}/${$("scr").value}/zone${z}/${base+i}-${safe}`;let {error}=await db.storage.from("media").upload(path,f,{cacheControl:"31536000",upsert:false});if(error){alert("Falha em "+f.name+": "+error.message);continue}let {data:u}=db.storage.from("media").getPublicUrl(path);let {error:e}=await db.from("zone_media_items").insert({zone_layout_id:layoutId,company_id:companyId,zone_no:z,file_name:f.name,file_url:u.publicUrl,mime_type:f.type,size_bytes:f.size,sort_order:base+i});if(e)alert(e.message)}inp.value="";await lists();alert("Arquivos enviados para a Zona "+z+".")}
async function lists(){let {data:a}=await db.from("zone_media_items").select("*").eq("zone_layout_id",layoutId).eq("active",true).order("sort_order");for(let z=1;z<=2;z++)$("list"+z).innerHTML=(a||[]).filter(x=>x.zone_no===z).map(x=>`<div class="item"><span>${x.file_name}</span><button class="del" onclick="del('${x.id}')">Excluir</button></div>`).join("")||'<p class="muted">Nenhum arquivo.</p>'}
async function del(id){if(!confirm("Excluir este arquivo da zona?"))return;await db.from("zone_media_items").update({active:false}).eq("id",id);await lists()}
</script></body></html>
