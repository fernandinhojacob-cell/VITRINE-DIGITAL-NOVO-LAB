<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Zoneamento</title><style>
body{font-family:Arial;background:#061525;color:#fff;max-width:760px;margin:25px auto;padding:18px}h1{margin-bottom:6px}.box{background:#0b2340;padding:18px;border-radius:14px;margin:16px 0}label{display:block;margin:12px 0 5px}input[type=text]{width:100%;padding:12px;border:0;border-radius:8px}.pick{display:block;width:100%;padding:14px;background:#102f53;border:1px dashed #5ba7ff;border-radius:10px;color:#fff}.preview{display:none;max-width:180px;max-height:120px;margin-top:10px;border-radius:8px}button,a{display:inline-block;padding:12px 18px;border:0;border-radius:9px;background:#0872d8;color:#fff;text-decoration:none;font-weight:700;margin:8px 8px 0 0}</style></head><body>
<h1>Player Zoneado</h1><p>Agora você pode escolher a foto diretamente do celular ou computador.</p>
<div class="box"><h2>Zona lateral 1</h2><label>Título</label><input type="text" id="a"><label>Texto</label><input type="text" id="b"><label>Foto</label><input class="pick" type="file" id="c" accept="image/*"><img class="preview" id="pc"></div>
<div class="box"><h2>Zona lateral 2</h2><label>Título</label><input type="text" id="d"><label>Texto</label><input type="text" id="e"><label>Foto / QR Code</label><input class="pick" type="file" id="f" accept="image/*"><img class="preview" id="pf"></div>
<div class="box"><h2>Faixa inferior</h2><label>Itens separados por vírgula</label><input type="text" id="g"></div>
<button onclick="save()">Salvar teste</button><a href="index.html?code=TV-85CCD986">Abrir Player</a>
<script>
const D={zone1Title:"VITRINE DIGITAL",zone1Text:"Sua marca em destaque",zone1Image:"",zone2Title:"FALE CONOSCO",zone2Text:"QR Code / WhatsApp / chamada",zone2Image:"",footer:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]};
let v=D;try{v={...D,...JSON.parse(localStorage.getItem("vitrine_zone_cfg")||"{}")}}catch(e){}
a.value=v.zone1Title;b.value=v.zone1Text;d.value=v.zone2Title;e.value=v.zone2Text;g.value=(v.footer||D.footer).join(", ");
let im1=v.zone1Image||"",im2=v.zone2Image||"";
function show(el,src){if(src){el.src=src;el.style.display="block"}}
show(pc,im1);show(pf,im2);
function read(file,cb){if(!file)return; if(file.size>2.5*1024*1024){alert("Escolha uma imagem menor que 2,5 MB para este teste.");return} const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
c.onchange=()=>read(c.files[0],x=>{im1=x;show(pc,x)});f.onchange=()=>read(f.files[0],x=>{im2=x;show(pf,x)});
function save(){try{localStorage.setItem("vitrine_zone_cfg",JSON.stringify({zone1Title:a.value,zone1Text:b.value,zone1Image:im1,zone2Title:d.value,zone2Text:e.value,zone2Image:im2,footer:g.value.split(",").map(x=>x.trim()).filter(Boolean)}));alert("Configuração e fotos salvas neste aparelho.")}catch(e){alert("A imagem ficou grande demais para o armazenamento local. Escolha uma foto menor.")}}
</script></body></html>
