<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoneamento — Vitrine Digital</title><style>body{font-family:Arial;background:#061525;color:#fff;max-width:820px;margin:20px auto;padding:18px}.box{background:#0b2340;padding:18px;border-radius:14px;margin:14px 0}label{display:block;margin:12px 0 5px}select,input{width:100%;padding:12px;border:0;border-radius:8px}input[type=range]{padding:0}.btn{display:inline-block;padding:12px 18px;border:0;border-radius:9px;background:#0872d8;color:#fff;text-decoration:none;font-weight:700;margin:8px 8px 0 0}.muted{opacity:.75}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body>
<h1>Zoneamento da tela</h1><p class="muted">Escolha a tela e mídias já cadastradas na Biblioteca. A configuração fica salva no Supabase e chega automaticamente ao Player Zoneado.</p>
<div class="box"><label>Tela</label><select id="screen"></select><label>Layout</label><select id="layout"><option value="main_side_footer">Principal + lateral + faixa</option><option value="main_side">Principal + lateral</option><option value="fullscreen">Tela inteira</option></select><div class="row"><label>Principal (%)<input id="main" type="range" min="55" max="90" value="72"></label><label>Faixa inferior (%)<input id="footer" type="range" min="10" max="35" value="22"></label></div></div>
<div class="box"><h2>Zona lateral 1</h2><label>Mídia</label><select id="m1"></select><label>Título</label><input id="t1"><label>Texto</label><input id="x1"></div>
<div class="box"><h2>Zona lateral 2</h2><label>Mídia</label><select id="m2"></select><label>Título</label><input id="t2"><label>Texto</label><input id="x2"></div>
<div class="box"><h2>Faixa inferior</h2><label>Itens separados por vírgula</label><input id="items" value="EVENTOS, EMPRESAS, PROMOÇÕES, INFORMAÇÕES"></div>
<button class="btn" id="save">Salvar zoneamento</button><a class="btn" id="open" target="_blank">Abrir Player Zoneado</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>
(async()=>{
const $=id=>document.getElementById(id);
const screenEl=$("screen"),layoutEl=$("layout"),mainEl=$("main"),footerEl=$("footer"),m1El=$("m1"),m2El=$("m2"),t1El=$("t1"),x1El=$("x1"),t2El=$("t2"),x2El=$("x2"),itemsEl=$("items"),openEl=$("open"),saveEl=$("save");
const db=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);
const {data:{session}}=await db.auth.getSession();
if(!session){location.href="../admin/login.html";return}
const {data:ss,error:se}=await db.from("screens").select("id,name,code,company_id").eq("active",true).order("name");
if(se){alert("Erro ao carregar telas: "+se.message);return}
screenEl.innerHTML=(ss||[]).map(s=>`<option value="${s.id}" data-code="${s.code}" data-company="${s.company_id}">${s.name} — ${s.code}</option>`).join("");
if(!(ss||[]).length){screenEl.innerHTML='<option value="">Nenhuma tela disponível</option>';return}
const {data:mm,error:me}=await db.from("media").select("id,name,type,mime_type,company_id").eq("active",true).order("name");
if(me){alert("Erro ao carregar mídias: "+me.message);return}
function medias(sel,cid,val){sel.innerHTML='<option value="">Sem mídia</option>'+(mm||[]).filter(m=>m.company_id===cid).map(m=>`<option value="${m.id}" ${m.id===val?"selected":""}>${m.name}</option>`).join("")}
async function load(){
 let o=screenEl.selectedOptions[0]; if(!o||!o.value)return;
 let cid=o.dataset.company;
 const {data:c,error}=await db.from("zone_layouts").select("*").eq("screen_id",screenEl.value).maybeSingle();
 if(error){alert("Erro ao carregar zoneamento: "+error.message);return}
 layoutEl.value=c?.layout||"main_side_footer";mainEl.value=c?.main_pct||72;footerEl.value=c?.footer_pct||22;
 medias(m1El,cid,c?.zone1_media_id);medias(m2El,cid,c?.zone2_media_id);
 t1El.value=c?.zone1_title||"";x1El.value=c?.zone1_text||"";t2El.value=c?.zone2_title||"";x2El.value=c?.zone2_text||"";
 itemsEl.value=(c?.footer_items||["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]).join(", ");
 openEl.href="index.html?code="+encodeURIComponent(o.dataset.code)+"&v=6.1";
}
screenEl.onchange=load;await load();
saveEl.onclick=async()=>{
 let o=screenEl.selectedOptions[0]; if(!o||!o.value)return;
 let row={screen_id:screenEl.value,company_id:o.dataset.company,layout:layoutEl.value,main_pct:+mainEl.value,footer_pct:+footerEl.value,zone1_media_id:m1El.value||null,zone2_media_id:m2El.value||null,zone1_title:t1El.value,zone1_text:x1El.value,zone2_title:t2El.value,zone2_text:x2El.value,footer_items:itemsEl.value.split(",").map(x=>x.trim()).filter(Boolean),active:true,updated_at:new Date().toISOString()};
 let {error}=await db.from("zone_layouts").upsert(row,{onConflict:"screen_id"});
 alert(error?"Erro: "+error.message:"Zoneamento salvo com sucesso.");if(!error)await load();
};
})();
</script></body></html>
