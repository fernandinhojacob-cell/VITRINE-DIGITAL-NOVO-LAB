<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Zoneamento</title><style>body{font-family:Arial;background:#061525;color:#fff;max-width:760px;margin:30px auto;padding:20px}h1{margin-bottom:6px}.box{background:#0b2340;padding:18px;border-radius:14px;margin:16px 0}label{display:block;margin:12px 0 5px}input{width:100%;padding:12px;border:0;border-radius:8px}button,a{display:inline-block;padding:12px 18px;border:0;border-radius:9px;background:#0872d8;color:#fff;text-decoration:none;font-weight:700;margin:8px 8px 0 0}</style></head><body><h1>Player Zoneado</h1><p>Configuração local de teste — não altera o Player 4.32.9.</p><div class="box"><h2>Zona lateral 1</h2><label>Título</label><input id="a"><label>Texto</label><input id="b"><label>URL da imagem (opcional)</label><input id="c"></div><div class="box"><h2>Zona lateral 2</h2><label>Título</label><input id="d"><label>Texto</label><input id="e"><label>URL da imagem/QR (opcional)</label><input id="f"></div><div class="box"><h2>Faixa inferior</h2><label>Itens separados por vírgula</label><input id="g"></div><button onclick="save()">Salvar teste</button><a href="index.html?code=TV-85CCD986">Abrir Player</a><script>
const D={zone1Title:"VITRINE DIGITAL",zone1Text:"Sua marca em destaque",zone1Image:"",zone2Title:"FALE CONOSCO",zone2Text:"QR Code / WhatsApp / chamada",zone2Image:"",footer:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]};let v=D;try{v={...D,...JSON.parse(localStorage.getItem("vitrine_zone_cfg")||"{}")}}catch(e){};a.value=v.zone1Title;b.value=v.zone1Text;c.value=v.zone1Image;d.value=v.zone2Title;e.value=v.zone2Text;f.value=v.zone2Image;g.value=(v.footer||D.footer).join(", ");function save(){localStorage.setItem("vitrine_zone_cfg",JSON.stringify({zone1Title:a.value,zone1Text:b.value,zone1Image:c.value,zone2Title:d.value,zone2Text:e.value,zone2Image:f.value,footer:g.value.split(",").map(x=>x.trim()).filter(Boolean)}));alert("Configuração salva neste aparelho.");}
</script></body></html>
