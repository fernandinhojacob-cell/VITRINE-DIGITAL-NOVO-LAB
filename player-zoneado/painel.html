<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Zoneamento V5</title><style>body{font-family:Arial;background:#061525;color:#fff;max-width:760px;margin:24px auto;padding:18px}.box{background:#0b2340;padding:18px;border-radius:14px;margin:15px 0}label{display:block;margin:12px 0 5px}input[type=text],input[type=range]{width:100%}input[type=text]{padding:12px;border:0;border-radius:8px}.pick{width:100%;padding:14px;background:#102f53;border:1px dashed #5ba7ff;border-radius:10px;color:#fff}button,a{display:inline-block;padding:12px 18px;border:0;border-radius:9px;background:#0872d8;color:#fff;text-decoration:none;font-weight:700;margin:8px 8px 0 0}.note{opacity:.8;font-size:13px}</style></head><body><h1>Player Zoneado V5</h1><p>Foto ou vídeo em cada zona + ajuste de proporções. O Player 4.32.9 continua separado.</p>
<div class="box"><h2>Layout da TV</h2><label>Conteúdo principal: <b id="mp"></b>%</label><input type="range" id="m" min="55" max="85" value="72"><label>Faixa inferior: <b id="fp"></b>%</label><input type="range" id="h" min="10" max="30" value="22"></div>
<div class="box"><h2>Zona lateral 1</h2><label>Título</label><input type="text" id="a"><label>Texto</label><input type="text" id="b"><label>Selecionar foto ou vídeo</label><input class="pick" type="file" id="c" accept="image/*,video/*"><div class="note">Para este teste local, prefira arquivos pequenos. Vídeos grandes podem ultrapassar o limite do navegador.</div></div>
<div class="box"><h2>Zona lateral 2</h2><label>Título</label><input type="text" id="d"><label>Texto</label><input type="text" id="e"><label>Selecionar foto ou vídeo</label><input class="pick" type="file" id="f" accept="image/*,video/*"></div>
<div class="box"><h2>Faixa inferior</h2><label>Itens separados por vírgula</label><input type="text" id="g"></div>
<button onclick="save()">Salvar teste</button><a href="index.html?code=TV-85CCD986&v=5">Abrir Player</a>
<script>
const D={zone1Title:"VITRINE DIGITAL",zone1Text:"Sua marca em destaque",zone1Media:"",zone1Type:"",zone2Title:"FALE CONOSCO",zone2Text:"",zone2Media:"",zone2Type:"",mainPct:72,footerPct:22,footer:["EVENTOS","EMPRESAS","PROMOÇÕES","INFORMAÇÕES"]};let v=D;try{v={...D,...JSON.parse(localStorage.getItem("vitrine_zone_v5")||"{}")}}catch(e){}
a.value=v.zone1Title;b.value=v.zone1Text;d.value=v.zone2Title;e.value=v.zone2Text;g.value=(v.footer||D.footer).join(", ");m.value=v.mainPct;h.value=v.footerPct;function labs(){mp.textContent=m.value;fp.textContent=h.value}m.oninput=h.oninput=labs;labs();let q1={src:v.zone1Media,type:v.zone1Type},q2={src:v.zone2Media,type:v.zone2Type};
function pick(inp,target){let file=inp.files[0];if(!file)return;let limit=file.type.startsWith("video/")?4:2.5;if(file.size>limit*1024*1024){alert("Para o teste local, escolha "+(file.type.startsWith("video/")?"um vídeo de até 4 MB.":"uma imagem de até 2,5 MB."));inp.value="";return}let r=new FileReader();r.onload=()=>{target.src=r.result;target.type=file.type.startsWith("video/")?"video":"image"};r.readAsDataURL(file)}
c.onchange=()=>pick(c,q1);f.onchange=()=>pick(f,q2);
function save(){let o={zone1Title:a.value,zone1Text:b.value,zone1Media:q1.src,zone1Type:q1.type,zone2Title:d.value,zone2Text:e.value,zone2Media:q2.src,zone2Type:q2.type,mainPct:+m.value,footerPct:+h.value,footer:g.value.split(",").map(x=>x.trim()).filter(Boolean)};try{localStorage.setItem("vitrine_zone_v5",JSON.stringify(o));alert("Layout e mídias salvos neste aparelho.")}catch(e){alert("O arquivo é grande demais para armazenamento local. Escolha uma mídia menor.")}}
</script></body></html>
