<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar tela</title><style>body{margin:0;background:#061525;color:#eef7ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.c{width:min(520px,88vw);padding:30px;border:1px solid #244866;border-radius:22px;background:#0b2033}input,button{box-sizing:border-box;width:100%;padding:15px;margin-top:12px;border-radius:12px;font-size:18px}button{border:0;background:#28bdf3;font-weight:800}.m{color:#9db1c4}.e{color:#ff9999}</style></head><body><div class="c"><h1>Vitrine Digital</h1><div id="b"><p>Conectar esta tela</p><p class="m">Escolha um nome para identificar a TV ou totem.</p><input id="n" maxlength="80" placeholder="Ex.: TV Recepção"><button id="g">Conectar tela</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const b=document.querySelector("#b"),t=new URLSearchParams(location.search).get("token"),c=window.VD_CONFIG||window.CONFIG||{},db=supabase.createClient(c.supabaseUrl||c.SUPABASE_URL,c.supabaseAnonKey||c.SUPABASE_ANON_KEY);if(!t)b.innerHTML='<p class="e">Link inválido.</p>';document.querySelector("#g")?.addEventListener("click",async()=>{const g=document.querySelector("#g");g.disabled=true;g.textContent="Conectando…";const {data,error}=await db.functions.invoke("activate-screen-link",{body:{token:t,name:document.querySelector("#n").value.trim()||"Nova tela"}});if(error||data?.error){b.innerHTML='<p class="e">'+(data?.error||error?.message||"Falha na ativação.")+"</p>";return}localStorage.setItem("vd_screen_id",data.screen.id);b.innerHTML='<h2>✓ Tela conectada</h2><p class="m">Abrindo o Player…</p>';setTimeout(()=>location.replace("../player/index.html?screen_id="+encodeURIComponent(data.screen.id)),800)});</script></body></html>
