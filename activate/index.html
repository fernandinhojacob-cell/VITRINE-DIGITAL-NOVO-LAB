<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrine Digital • Ativar tela</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#123b73,#06162d 55%,#020914);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{text-align:center;width:min(92vw,760px);padding:32px}.logo{font-weight:800;font-size:clamp(26px,4vw,42px)}.mark{color:#22a7ff}.lead{font-size:clamp(20px,3vw,32px);margin:34px 0 18px}.code{font-size:clamp(54px,11vw,108px);font-weight:900;letter-spacing:.12em;border:2px solid #4e80c7;border-radius:18px;padding:18px 24px;background:#071a35}.help{font-size:clamp(16px,2vw,22px);line-height:1.45;margin-top:22px;color:#d7e7ff}.status{margin-top:24px;color:#8fc7ff}.error{color:#ff9aa8}</style></head><body><main class="wrap"><div class="logo"><span class="mark">▶</span> VITRINE DIGITAL</div><div class="lead">Conecte esta tela à sua empresa</div><div id="code" class="code">••• •••</div><div class="help">Acesse o painel da Vitrine Digital<br>e adicione esta tela usando o código acima.</div><div id="status" class="status">Gerando código de ativação…</div></main><script src="../js/config.js"></script><script>const cfg=window.SUPABASE_CONFIG||{},codeEl=document.getElementById("code"),statusEl=document.getElementById("status"),endpoint=cfg.url+"/functions/v1/screen-activation";let device=localStorage.getItem("vd_device_key")||"";async function call(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.key},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||j.error)throw new Error(j.error||"Falha");return j}function show(c){codeEl.textContent=(c||"").replace(/(\d{3})(\d{3})/,"$1 $2")}async function start(){try{const x=await call({action:"register",device_key:device});device=x.device_key;localStorage.setItem("vd_device_key",device);show(x.activation_code);statusEl.textContent="Aguardando vínculo com a empresa…";setInterval(check,4000)}catch(e){statusEl.className="status error";statusEl.textContent="Não foi possível gerar o código. Atualize a página."}}async function check(){try{const x=await call({action:"status",device_key:device});if(x.activation?.status==="claimed"&&x.activation.screen_id){statusEl.textContent="Tela vinculada com sucesso ✓";setTimeout(()=>location.href="../player/index.html?screen_id="+encodeURIComponent(x.activation.screen_id),1200)}}catch(e){}}start();</script></body></html>
