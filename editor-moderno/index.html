<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitrine Digital V14.2</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
<div class="brand">▶ VITRINE DIGITAL<br><small>Editor Visual</small></div>
<div class="info"><b>TV-001</b><br>Recepção Hospital<br>Principal + 2 zonas</div>
<div class="actions"><button>Visualizar</button><button>Salvar</button></div>
</header>

<main>
<section class="preview">
<h1>Editor Visual</h1>
<p>Configure o layout e gerencie cada zona</p>
<div class="screen">
<div class="main-zone">PRINCIPAL<br><span>70%</span></div>
<div class="bottom">
<div class="zone z1">ZONA 1<br><span>15%</span></div>
<div class="zone z2">ZONA 2<br><span>15%</span></div>
</div>
</div>
</section>

<aside>
<h2>Ajuste das zonas</h2>
<div class="card">🖼️ Principal <b>70%</b></div>
<div class="card">🟩 Zona 1 <b>15%</b></div>
<div class="card">🟪 Zona 2 <b>15%</b></div>
</aside>
</main>
</body>
</html>
