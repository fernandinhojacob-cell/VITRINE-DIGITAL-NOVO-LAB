<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitrine Digital - Editor Visual</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
<div><b>▶ VITRINE DIGITAL</b><small> Editor Visual</small></div>
<button>Visualizar</button><button class="save">Salvar</button>
</header>

<main>
<section class="preview">
<h1>Editor Visual</h1>
<p>Configure o layout e gerencie cada zona</p>
<div class="screen">
<div class="principal">PRINCIPAL<br><span>70%</span></div>
<div class="bottom">
<div class="zona1">ZONA 1<br><span>15%</span></div>
<div class="zona2">ZONA 2<br><span>15%</span></div>
</div>
</div>
</section>

<section class="cards">
<h2>Ajuste das zonas</h2>
<div>🖼 Principal <strong>70%</strong></div>
<div>🟩 Zona 1 <strong>15%</strong></div>
<div>🟪 Zona 2 <strong>15%</strong></div>

<h2>Modelos de layout</h2>
<div class="models">
<button>Tela inteira</button>
<button>Principal + lateral</button>
<button>Principal + 2 zonas</button>
<button>Principal + rodapé</button>
</div>
</section>
</main>
</body>
</html>
